name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Demo breaking fixture
        run: node dist/cli.js check --base fixtures/base.openapi.yaml --head fixtures/head-breaking.openapi.yaml || test $? = 1
      - name: Demo compatible fixture
        run: node dist/cli.js check --base fixtures/base.openapi.yaml --head fixtures/head-compatible.openapi.yaml
